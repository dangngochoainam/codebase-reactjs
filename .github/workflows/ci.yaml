name: Docker CI Pipeline

on:
  push:
    branches:
      - feat/cicd

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: dev
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/codebase-reactjs:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/codebase-reactjs:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/codebase-reactjs:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/codebase-reactjs:buildcache,mode=max
