name: Docker CI/CD pipeline

on:
  push:
    branches:
      - feat/cicd

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build
        run: |
          docker build -t codebase-reactjs .

      - name: Push image to Docker Hub
        uses: docker/push-action@v3
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/codebase-reactjs:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push

    environment: dev
    env: 
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/codebase-reactjs:${{ github.sha }}

            docker stop codebase-reactjs || true
            docker rm codebase-reactjs || true

            docker run -d \
            -p 80:80 \
            --name codebase-reactjs \
            --network docker_stack \
            ${{ secrets.DOCKER_USERNAME }}/codebase-reactjs:${{ github.sha }}
